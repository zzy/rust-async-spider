[package]
name = "rust-async-spider"
version = "0.1.0"
authors = ["zzy <ask@niqin.com>"]
edition = "2024"

[dependencies]
scraper = "0.23"
colored = "3.0"

tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
reqwest = "0.12"

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true
